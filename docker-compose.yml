# bot     - REST API бота (FastAPI), читает индекс из faiss_index/
# updater - cron внутри контейнера, раз в сутки запускает scripts/run_update.sh
#           и обновляет faiss_index/ по содержимому knowledge_base/
#
# Переменные подставляются из файла .env в корне проекта (см. .env.example)

x-app-env: &app-env
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-gpt-4o-mini}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
  CHUNK_SIZE: ${CHUNK_SIZE:-1200}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
  TOP_K: ${TOP_K:-4}
  RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.35}
  PROTECTION_LEVEL: ${PROTECTION_LEVEL:-3}

services:
  bot:
    build: .
    image: quantumforge-rag:latest
    ports:
      - "8000:8000"
    environment: *app-env
    volumes:
      - ./faiss_index:/app/faiss_index:ro
      - ./logs:/app/logs
      - hf_cache:/hf_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  updater:
    build: .
    image: quantumforge-rag:latest
    command: ["/app/deploy/updater-entrypoint.sh"]
    environment:
      <<: *app-env
      UPDATE_ATTEMPTS: ${UPDATE_ATTEMPTS:-3}
      UPDATE_RETRY_DELAY_SEC: ${UPDATE_RETRY_DELAY_SEC:-300}
      QUARANTINE_INJECTIONS: ${QUARANTINE_INJECTIONS:-false}
      RUN_ON_START: ${RUN_ON_START:-false}
      RUN_EVAL_AFTER_UPDATE: ${RUN_EVAL_AFTER_UPDATE:-false}
      EVAL_MIN_PASS: ${EVAL_MIN_PASS:-0.7}
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./faiss_index:/app/faiss_index
      - ./logs:/app/logs
      - hf_cache:/hf_cache
    restart: unless-stopped

volumes:
  hf_cache:
